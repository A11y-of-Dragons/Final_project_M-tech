services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: photos
      POSTGRES_USER: photos
      POSTGRES_PASSWORD: photos_local_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://photos:photos_local_password@db:5432/photos
      UPLOAD_DIR: /app/uploads
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - photo_uploads:/app/uploads

volumes:
  postgres_data:
  photo_uploads: