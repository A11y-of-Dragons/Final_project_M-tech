
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Gallery & Boards</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f7f8fa;
    }

    .photo-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #e9ecef;
    }

    .photo-card {
      overflow: hidden;
    }

    .tag-button,
    .board-button {
      border: 0;
      cursor: pointer;
    }

    .board-button {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 8px;
      background: transparent;
      color: #495057;
    }

    .board-button:hover {
      background: #e9ecef;
    }

    .board-button.active {
      background: #e7f0ff;
      color: #0d6efd;
      font-weight: 600;
    }

    .sidebar {
      min-width: 220px;
    }

    .board-count {
      float: right;
      color: #6c757d;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

<header class="bg-white border-bottom">
  <div class="container py-4">
    <h1 class="h3 mb-1">Photo Gallery</h1>
    <p class="text-secondary mb-0">
      Upload, organize, and discover your photos.
    </p>
  </div>
</header>

<main class="container py-4">

  <div id="message" class="alert d-none" role="status"></div>

  <div class="row g-4">

    <!-- BOARD SIDEBAR -->

    <aside class="col-12 col-md-3 sidebar">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">My Boards</h2>

        <button
          class="btn btn-sm btn-outline-primary"
          data-bs-toggle="modal"
          data-bs-target="#createBoardModal"
        >
          + New
        </button>
      </div>

      <nav id="board-list" aria-label="Photo boards">
        <button
          class="board-button active"
          data-board-id="all"
        >
          All Photos
        </button>
      </nav>

    </aside>

    <!-- MAIN CONTENT -->

    <section class="col-12 col-md-9">

      <!-- UPLOAD -->

      <section class="card shadow-sm mb-4">
        <div class="card-body">

          <h2 class="h5">Upload a photo</h2>

          <form id="upload-form">

            <div class="mb-3">
              <label for="image" class="form-label">Image</label>

              <input
                id="image"
                name="image"
                class="form-control"
                type="file"
                accept="image/jpeg,image/png,image/webp"
                required
              >

              <div class="form-text">
                JPEG, PNG, or WebP; maximum 10 MB.
              </div>
            </div>

            <div class="mb-3">
              <label for="caption" class="form-label">Caption</label>

              <input
                id="caption"
                name="caption"
                class="form-control"
                maxlength="500"
                placeholder="Add a caption"
              >
            </div>

            <div class="mb-3">
              <label for="tags" class="form-label">Tags</label>

              <input
                id="tags"
                name="tags"
                class="form-control"
                placeholder="travel, mountains, weekend"
              >
            </div>

            <div class="mb-3">
              <label for="upload-boards" class="form-label">
                Add to boards
              </label>

              <select
                id="upload-boards"
                name="boardIds"
                class="form-select"
                multiple
              ></select>

              <div class="form-text">
                Select one or more boards.
              </div>
            </div>

            <button
              id="upload-button"
              class="btn btn-primary"
              type="submit"
            >
              Upload photo
            </button>

          </form>
        </div>
      </section>

      <!-- GALLERY -->

      <section>

        <div class="d-flex flex-wrap justify-content-between
                    align-items-end gap-3 mb-3">

          <div>
            <h2 id="gallery-heading" class="h4 mb-0">
              All Photos
            </h2>

            <p class="text-secondary mb-0">
              Search captions, tags, and boards.
            </p>
          </div>

          <form id="search-form" class="d-flex flex-wrap gap-2">

            <input
              id="search-query"
              class="form-control"
              type="search"
              placeholder="Search photos"
              aria-label="Search photos"
            >

            <input
              id="search-tag"
              class="form-control"
              placeholder="Exact tag"
              aria-label="Filter by exact tag"
            >

            <button class="btn btn-outline-primary" type="submit">
              Search
            </button>

            <button
              id="clear-search"
              class="btn btn-outline-secondary"
              type="button"
            >
              Clear
            </button>

          </form>
        </div>

        <div id="photo-grid" class="row g-3"></div>

        <p
          id="empty-state"
          class="text-secondary text-center py-5 d-none"
        >
          No photos found. Upload one or try another board.
        </p>

      </section>

    </section>

  </div>
</main>

<!-- CREATE BOARD MODAL -->

<div
  class="modal fade"
  id="createBoardModal"
  tabindex="-1"
  aria-labelledby="createBoardHeading"
  aria-hidden="true"
>
  <div class="modal-dialog">

    <div class="modal-content">

      <form id="create-board-form">

        <div class="modal-header">
          <h2 class="modal-title fs-5" id="createBoardHeading">
            Create a Board
          </h2>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>

        <div class="modal-body">

          <label for="board-name" class="form-label">
            Board name
          </label>

          <input
            id="board-name"
            name="name"
            class="form-control"
            maxlength="100"
            placeholder="e.g. Travel Inspiration"
            required
          >

          <label for="board-description" class="form-label mt-3">
            Description (optional)
          </label>

          <textarea
            id="board-description"
            name="description"
            class="form-control"
            maxlength="500"
            rows="3"
            placeholder="What is this board about?"
          ></textarea>

        </div>

        <div class="modal-footer">

          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>

          <button type="submit" class="btn btn-primary">
            Create Board
          </button>

        </div>

      </form>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const uploadForm = document.querySelector("#upload-form");
  const uploadButton = document.querySelector("#upload-button");

  const boardList = document.querySelector("#board-list");
  const uploadBoards = document.querySelector("#upload-boards");

  const searchForm = document.querySelector("#search-form");
  const searchQuery = document.querySelector("#search-query");
  const searchTag = document.querySelector("#search-tag");

  const photoGrid = document.querySelector("#photo-grid");
  const emptyState = document.querySelector("#empty-state");
  const message = document.querySelector("#message");

  const galleryHeading = document.querySelector("#gallery-heading");

  let boards = [];
  let activeBoard = "all";

  function showMessage(text, type = "success") {
    message.className = `alert alert-${type}`;
    message.textContent = text;
  }

  async function api(url, options = {}) {
    const response = await fetch(url, options);

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || "The request failed.");
    }

    return data;
  }

  // LOAD BOARDS

  async function loadBoards() {
    const data = await api("/api/boards");

    boards = data.boards || [];

    renderBoards();
    renderUploadBoardOptions();
  }

  // RENDER SIDEBAR

  function renderBoards() {
    boardList.replaceChildren();

    const allButton = document.createElement("button");

    allButton.type = "button";
    allButton.className =
      `board-button ${activeBoard === "all" ? "active" : ""}`;

    allButton.textContent = "All Photos";

    allButton.addEventListener("click", () => {
      selectBoard("all");
    });

    boardList.append(allButton);

    for (const board of boards) {
      const button = document.createElement("button");

      button.type = "button";
      button.className =
        `board-button ${activeBoard === board.id ? "active" : ""}`;

      button.textContent = board.name;

      const count = document.createElement("span");
      count.className = "board-count";
      count.textContent = board.photoCount ?? 0;

      button.append(count);

      button.addEventListener("click", () => {
        selectBoard(board.id);
      });

      boardList.append(button);
    }
  }

  // UPLOAD BOARD OPTIONS

  function renderUploadBoardOptions() {
    uploadBoards.replaceChildren();

    for (const board of boards) {
      const option = document.createElement("option");

      option.value = board.id;
      option.textContent = board.name;

      uploadBoards.append(option);
    }
  }

  // SELECT BOARD

  function selectBoard(boardId) {
    activeBoard = boardId;

    const board = boards.find(
      item => String(item.id) === String(boardId)
    );

    galleryHeading.textContent =
      board ? board.name : "All Photos";

    renderBoards();
    loadPhotos();
  }

  // RENDER PHOTOS

  function renderPhotos(photos) {
    photoGrid.replaceChildren();

    emptyState.classList.toggle(
      "d-none",
      photos.length > 0
    );

    for (const photo of photos) {
      const column = document.createElement("div");

      column.className =
        "col-12 col-sm-6 col-lg-6 col-xl-4";

      const card = document.createElement("article");

      card.className =
        "card photo-card h-100 shadow-sm";

      const image = document.createElement("img");

      image.className = "photo-image";
      image.src = photo.imageUrl;
      image.alt = photo.caption || "Uploaded photo";
      image.loading = "lazy";

      const body = document.createElement("div");

      body.className = "card-body";

      const caption = document.createElement("h3");

      caption.className = "h6 card-title";
      caption.textContent =
        photo.caption || "Untitled photo";

      // TAGS

      const tagList = document.createElement("div");

      tagList.className = "d-flex flex-wrap mb-2";

      for (const tag of photo.tags || []) {
        const tagButton = document.createElement("button");

        tagButton.type = "button";

        tagButton.className =
          "badge rounded-pill text-bg-light border tag-button me-1 mb-1";

        tagButton.textContent = tag;

        tagButton.addEventListener("click", () => {
          searchTag.value = tag;
          searchForm.requestSubmit();
        });

        tagList.append(tagButton);
      }

      // BOARD LABELS

      const boardLabels = document.createElement("div");

      boardLabels.className = "mb-2";

      for (const board of photo.boards || []) {
        const label = document.createElement("span");

        label.className =
          "badge text-bg-primary me-1 mb-1";

        label.textContent = board.name;

        boardLabels.append(label);
      }

      // DATE

      const date = document.createElement("small");

      date.className = "text-secondary d-block";

      date.textContent = photo.created_at
        ? new Date(photo.created_at).toLocaleDateString()
        : "";

      body.append(
        caption,
        tagList,
        boardLabels,
        date
      );

      card.append(image, body);
      column.append(card);

      photoGrid.append(column);
    }
  }

  // LOAD PHOTOS

  async function loadPhotos() {
    const params = new URLSearchParams({
      page: "1",
      limit: "24"
    });

    const query = searchQuery.value.trim();
    const tag = searchTag.value.trim();

    if (query) params.set("q", query);
    if (tag) params.set("tag", tag);

    if (activeBoard !== "all") {
      params.set("boardId", activeBoard);
    }

    try {
      const data = await api(`/api/photos?${params}`);

      renderPhotos(data.photos || []);

    } catch (error) {
      showMessage(error.message, "danger");
    }
  }

  // UPLOAD PHOTO

  uploadForm.addEventListener("submit", async event => {
    event.preventDefault();

    uploadButton.disabled = true;
    uploadButton.textContent = "Uploading…";

    try {
      const formData = new FormData(uploadForm);

      const selectedBoards = Array.from(
        uploadBoards.selectedOptions
      ).map(option => option.value);

      formData.delete("boardIds");
      formData.set("boardIds", JSON.stringify(selectedBoards));

      await api("/api/photos", {
        method: "POST",
        body: formData
      });

      uploadForm.reset();

      showMessage("Photo uploaded successfully.");

      await Promise.all([
        loadBoards(),
        loadPhotos()
      ]);

    } catch (error) {
      showMessage(error.message, "danger");

    } finally {
      uploadButton.disabled = false;
      uploadButton.textContent = "Upload photo";
    }
  });

  // CREATE BOARD

  document
    .querySelector("#create-board-form")
    .addEventListener("submit", async event => {

      event.preventDefault();

      const form = event.currentTarget;

      const formData = new FormData(form);

      try {
        await api("/api/boards", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name: formData.get("name"),
            description: formData.get("description")
          })
        });

        form.reset();

        bootstrap.Modal
          .getOrCreateInstance(
            document.querySelector("#createBoardModal")
          )
          .hide();

        showMessage("Board created successfully.");

        await loadBoards();

      } catch (error) {
        showMessage(error.message, "danger");
      }
    });

  // SEARCH

  searchForm.addEventListener("submit", event => {
    event.preventDefault();
    loadPhotos();
  });

  // CLEAR SEARCH

  document
    .querySelector("#clear-search")
    .addEventListener("click", () => {

      searchQuery.value = "";
      searchTag.value = "";

      loadPhotos();
    });

  // INITIALIZE

  async function initialize() {
    try {
      await loadBoards();
      await loadPhotos();
    } catch (error) {
      showMessage(error.message, "danger");
    }
  }

  initialize();
</script>

</body>
</html>
