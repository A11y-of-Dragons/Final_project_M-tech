<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Gallery</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    body {
      background: #f7f8fa;
    }

    .photo-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #e9ecef;
    }

    .photo-card {
      overflow: hidden;
    }

    .tag-button {
      border: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="bg-white border-bottom">
    <div class="container py-4">
      <h1 class="h3 mb-1">Photo Gallery</h1>
      <p class="text-secondary mb-0">Upload, tag, and find your photos.</p>
    </div>
  </header>

  <main class="container py-4">
    <div id="message" class="alert d-none" role="status" aria-live="polite"></div>

    <section class="card shadow-sm mb-4" aria-labelledby="upload-heading">
      <div class="card-body">
        <h2 id="upload-heading" class="h5">Upload a photo</h2>

        <form id="upload-form">
          <div class="mb-3">
            <label for="image" class="form-label">Image</label>
            <input
              id="image"
              name="image"
              class="form-control"
              type="file"
              accept="image/jpeg,image/png,image/webp"
              required
            >
            <div class="form-text">JPEG, PNG, or WebP; maximum 10 MB.</div>
          </div>

          <div class="mb-3">
            <label for="caption" class="form-label">Caption</label>
            <input
              id="caption"
              name="caption"
              class="form-control"
              type="text"
              maxlength="500"
              placeholder="Add a caption"
            >
          </div>

          <div class="mb-3">
            <label for="tags" class="form-label">Tags</label>
            <input
              id="tags"
              name="tags"
              class="form-control"
              type="text"
              placeholder="travel, mountains, weekend"
            >
            <div class="form-text">Separate tags with commas; up to 20 tags.</div>
          </div>

          <button id="upload-button" class="btn btn-primary" type="submit">
            Upload photo
          </button>
        </form>
      </div>
    </section>

    <section aria-labelledby="gallery-heading">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
        <div>
          <h2 id="gallery-heading" class="h4 mb-0">Gallery</h2>
          <p class="text-secondary mb-0">Search captions and tags, or filter by an exact tag.</p>
        </div>

        <form id="search-form" class="d-flex flex-wrap gap-2">
          <label class="visually-hidden" for="search-query">Search photos</label>
          <input
            id="search-query"
            class="form-control"
            type="search"
            placeholder="Search captions or tags"
          >

          <label class="visually-hidden" for="search-tag">Filter by exact tag</label>
          <input
            id="search-tag"
            class="form-control"
            type="text"
            placeholder="Exact tag"
          >

          <button class="btn btn-outline-primary" type="submit">Search</button>
          <button id="clear-search" class="btn btn-outline-secondary" type="button">Clear</button>
        </form>
      </div>

      <div id="photo-grid" class="row g-3"></div>
      <p id="empty-state" class="text-secondary text-center py-5 d-none">
        No photos found. Upload one or try a different search.
      </p>
    </section>
  </main>

  <script>
    const uploadForm = document.querySelector("#upload-form");
    const uploadButton = document.querySelector("#upload-button");
    const searchForm = document.querySelector("#search-form");
    const searchQuery = document.querySelector("#search-query");
    const searchTag = document.querySelector("#search-tag");
    const photoGrid = document.querySelector("#photo-grid");
    const emptyState = document.querySelector("#empty-state");
    const message = document.querySelector("#message");

    function showMessage(text, type = "success") {
      message.className = `alert alert-${type}`;
      message.textContent = text;
    }

    async function readResponse(response) {
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error || "The request failed.");
      }
      return data;
    }

    function renderPhotos(photos) {
      photoGrid.replaceChildren();
      emptyState.classList.toggle("d-none", photos.length > 0);

      for (const photo of photos) {
        const column = document.createElement("div");
        column.className = "col-12 col-sm-6 col-lg-4 col-xl-3";

        const card = document.createElement("article");
        card.className = "card photo-card h-100 shadow-sm";

        const image = document.createElement("img");
        image.className = "photo-image";
        image.src = photo.imageUrl;
        image.alt = photo.caption || "Uploaded photo";
        image.loading = "lazy";

        const body = document.createElement("div");
        body.className = "card-body";

        const caption = document.createElement("h3");
        caption.className = "h6 card-title";
        caption.textContent = photo.caption || "Untitled photo";

        const tagList = document.createElement("div");
        tagList.className = "d-flex flex-wrap";

        for (const tag of photo.tags || []) {
          const tagButton = document.createElement("button");
          tagButton.type = "button";
          tagButton.className = "badge rounded-pill text-bg-light border tag-button me-1 mb-1";
          tagButton.textContent = tag;
          tagButton.setAttribute("aria-label", `Filter by tag ${tag}`);
          tagButton.addEventListener("click", () => {
            searchTag.value = tag;
            searchForm.requestSubmit();
          });
          tagList.append(tagButton);
        }

        const date = document.createElement("small");
        date.className = "text-secondary";
        date.textContent = new Date(photo.created_at).toLocaleDateString();

        body.append(caption, tagList, date);
        card.append(image, body);
        column.append(card);
        photoGrid.append(column);
      }
    }

    async function loadPhotos() {
      const params = new URLSearchParams({ page: "1", limit: "24" });
      const query = searchQuery.value.trim();
      const tag = searchTag.value.trim();

      if (query) params.set("q", query);
      if (tag) params.set("tag", tag);

      try {
        const response = await fetch(`/api/photos?${params}`);
        const data = await readResponse(response);
        renderPhotos(data.photos);
      } catch (error) {
        showMessage(error.message, "danger");
      }
    }

    uploadForm.addEventListener("submit", async event => {
      event.preventDefault();
      uploadButton.disabled = true;
      uploadButton.textContent = "Uploading…";

      try {
        const response = await fetch("/api/photos", {
          method: "POST",
          body: new FormData(uploadForm)
        });
        await readResponse(response);
        uploadForm.reset();
        showMessage("Photo uploaded.");
        await loadPhotos();
      } catch (error) {
        showMessage(error.message, "danger");
      } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = "Upload photo";
      }
    });

    searchForm.addEventListener("submit", event => {
      event.preventDefault();
      loadPhotos();
    });

    document.querySelector("#clear-search").addEventListener("click", () => {
      searchQuery.value = "";
      searchTag.value = "";
      loadPhotos();
    });

    loadPhotos();
  </script>
</body>
</html>
